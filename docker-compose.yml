x-volume-mounts: &volumes
  - ./source/dictation:/source/dictation
  - ./README.md:/README.md
  - ./source/dictation:/usr/local/lib/python/site-packages/dictation
  - ./tests:/tests

services:

  black:
    container_name: dictation-black
    build:
      dockerfile: ./Dockerfile
      context: ./
    image: dictation-black
    environment:
      - SERVICE=black
    volumes:
      *volumes

  flakes:
    container_name: consonance-client-flakes
    build:
      dockerfile: ./Dockerfile
      context: ./
    image: dictation-flakes
    environment:
      - SERVICE=flakes
    volumes:
      *volumes

  tests:
    container_name: dictation-tests
    build:
      dockerfile: ./Dockerfile
      context: ./
    image: dictation-tests
    environment:
      - SERVICE=tests
    volumes:
      *volumes
